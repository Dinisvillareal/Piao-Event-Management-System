<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Events — master-detail preview</title>
<style>
  :root {
    --bg: #0A0E1A;
    --panel: #0D1220;
    --border: rgba(255,255,255,0.10);
    --border-strong: rgba(255,255,255,0.40);
    --text: #ffffff;
    --text-dim: rgba(255,255,255,0.55);
    --text-faint: rgba(255,255,255,0.35);
    --gold: #E8B84B;
    --gold-soft: rgba(232,184,75,0.15);
    --teal: #7DD8CB;
    --teal-soft: rgba(79,190,176,0.12);
    --red: #F26D6D;
    --red-soft: rgba(242,109,109,0.12);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  .app { display: flex; flex-direction: column; height: 100vh; }
  .topbar {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 22px 28px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .topbar h1 { margin: 0 0 4px; font-size: 26px; font-weight: 800; }
  .topbar p { margin: 0; color: var(--text-dim); font-size: 13px; }
  .post-btn {
    background: var(--gold); color: #1a1300; border: none; border-radius: 999px;
    padding: 10px 18px; font-weight: 700; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .body { display: flex; flex: 1; min-height: 0; }

  /* ── Left: compact list, inbox-style ── */
  .list-pane {
    width: 340px; flex-shrink: 0; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  .list-search {
    padding: 14px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .list-search input {
    width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 12px; color: var(--text); font-size: 13px; outline: none;
  }
  .list-search input::placeholder { color: var(--text-faint); }
  .list-filters {
    display: flex; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .chip {
    font-size: 11.5px; font-weight: 600; padding: 5px 11px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--text-dim); cursor: pointer;
  }
  .chip.active { background: var(--gold-soft); border-color: rgba(232,184,75,0.4); color: var(--gold); }
  .list-scroll { flex: 1; overflow-y: auto; }
  .list-count { padding: 10px 16px 4px; font-size: 11px; color: var(--text-faint); }
  .row {
    display: block; width: 100%; text-align: left; background: none; border: none;
    padding: 12px 16px; cursor: pointer; border-left: 3px solid transparent;
    border-bottom: 1px solid rgba(255,255,255,0.05); color: inherit;
  }
  .row:hover { background: rgba(255,255,255,0.03); }
  .row.selected { background: rgba(232,184,75,0.06); border-left-color: var(--gold); }
  .row-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .row-title { font-size: 13.5px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-meta { font-size: 11.5px; color: var(--text-faint); display: flex; align-items: center; gap: 6px; }
  .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--text-faint); flex-shrink: 0; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .status-dot.upcoming { background: var(--teal); }
  .status-dot.completed { background: rgba(255,255,255,0.3); }
  .row-cat { font-size: 10.5px; font-weight: 600; color: var(--gold); text-transform: uppercase; letter-spacing: 0.02em; }

  /* ── Right: detail panel ── */
  .detail-pane { flex: 1; overflow-y: auto; min-width: 0; }
  .detail-inner { max-width: 640px; padding: 32px 40px; }
  .detail-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 6px; }
  .detail-title { font-size: 22px; font-weight: 800; margin: 0; line-height: 1.25; }
  .status-pill {
    flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 700; padding: 5px 12px; border-radius: 999px;
  }
  .status-pill.upcoming { background: var(--teal-soft); color: var(--teal); }
  .status-pill.completed { background: rgba(255,255,255,0.06); color: var(--text-dim); }
  .detail-cat { font-size: 12px; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 22px; }

  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 24px; margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
  .meta-item .label { font-size: 10.5px; font-weight: 700; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
  .meta-item .value { font-size: 14px; font-weight: 600; color: var(--text); }

  .section { margin-bottom: 28px; }
  .section h3 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); margin: 0 0 10px; }
  .section p { font-size: 14px; line-height: 1.6; color: rgba(255,255,255,0.8); margin: 0; }

  .stat-row { display: flex; gap: 12px; }
  .stat-card { flex: 1; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .stat-card .num { font-size: 20px; font-weight: 800; }
  .stat-card .lbl { font-size: 11px; color: var(--text-faint); margin-top: 2px; }

  .actions { display: flex; align-items: center; gap: 10px; padding-top: 8px; }
  .btn { border-radius: 999px; padding: 10px 18px; font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text); display: inline-flex; align-items: center; gap: 6px; }
  .btn.primary { background: var(--gold); color: #1a1300; border: none; }
  .btn.danger { color: var(--red); border-color: rgba(242,109,109,0.3); background: var(--red-soft); margin-left: auto; }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div>
      <h1>Events</h1>
      <p>Manage community events, track attendance, and monitor budgets in real time.</p>
    </div>
    <button class="post-btn">+ Post Event</button>
  </div>

  <div class="body">
    <div class="list-pane">
      <div class="list-search"><input placeholder="Search events…" /></div>
      <div class="list-filters">
        <div class="chip active">All</div>
        <div class="chip">Upcoming</div>
        <div class="chip">Completed</div>
      </div>
      <div class="list-count">33 events</div>
      <div class="list-scroll" id="list"></div>
    </div>

    <div class="detail-pane">
      <div class="detail-inner" id="detail"></div>
    </div>
  </div>
</div>

<script>
const events = [
  { id:1, title:"Solo Parent Wellness Circle", location:"Barangay Multipurpose Hall", date:"2026-09-25", time:"1:00 PM", status:"completed", category:"Solo Parent Support", attendees: 24, budget: "₱8,500", desc:"Support group and wellness session for Solo Parent Support Program members. Includes a short talk from the barangay health worker and light snacks." },
  { id:2, title:"Livelihood Skills Fair", location:"Barangay Covered Court", date:"2026-10-15", time:"9:00 AM", status:"upcoming", category:"Livelihood Assistance", attendees: 0, budget: "₱42,000", desc:"Full-day skills training and job fair for Livelihood Assistance Program members, in partnership with three local employers and two TESDA-accredited trainers." },
  { id:3, title:"PWD Assistive Devices Distribution", location:"Barangay Health Center", date:"2026-10-08", time:"9:00 AM", status:"upcoming", category:"PWD Assistance", attendees: 0, budget: "₱65,000", desc:"Distribution of wheelchairs, canes, and other assistive devices for PWD Assistance members, coordinated with the City Social Welfare Office." },
  { id:4, title:"Community Feeding Program", location:"Barangay Covered Court", date:"2026-10-01", time:"9:00 AM", status:"upcoming", category:"Walang Gutom", attendees: 0, budget: "₱15,000", desc:"Community feeding activity providing meals for food-poor families under Walang Gutom, run alongside a short nutrition briefing." },
  { id:5, title:"Senior Citizen Monthly Pension Release", location:"Barangay Hall", date:"2026-09-20", time:"8:00 AM", status:"completed", category:"Senior Citizen Program", attendees: 118, budget: "₱354,000", desc:"Monthly pension distribution and check-in for Senior Citizen Program members, with a nurse on site for basic health checks." },
  { id:6, title:"Youth Sports Fest", location:"Barangay Covered Court", date:"2026-10-22", time:"7:00 AM", status:"upcoming", category:"Youth Development", attendees: 0, budget: "₱28,000", desc:"Inter-purok basketball and volleyball tournament for barangay youth, capped with an awarding ceremony in the afternoon." },
];

let selectedId = events[0].id;

function statusLabel(s){ return s === "upcoming" ? "Upcoming" : "Completed"; }

function renderList(){
  const list = document.getElementById("list");
  list.innerHTML = events.map(e => `
    <button class="row ${e.id === selectedId ? 'selected' : ''}" onclick="selectEvent(${e.id})">
      <div class="row-top">
        <div class="row-title">${e.title}</div>
      </div>
      <div class="row-meta">
        <span class="status-dot ${e.status}"></span>
        <span>${e.date}</span>
        <span class="dot"></span>
        <span>${statusLabel(e.status)}</span>
      </div>
      <div class="row-cat" style="margin-top:5px">${e.category}</div>
    </button>
  `).join("");
}

function renderDetail(){
  const e = events.find(x => x.id === selectedId);
  const detail = document.getElementById("detail");
  detail.innerHTML = `
    <div class="detail-top">
      <h2 class="detail-title">${e.title}</h2>
      <span class="status-pill ${e.status}">
        <span class="status-dot ${e.status}"></span> ${statusLabel(e.status)}
      </span>
    </div>
    <div class="detail-cat">${e.category}</div>

    <div class="meta-grid">
      <div class="meta-item"><div class="label">Location</div><div class="value">${e.location}</div></div>
      <div class="meta-item"><div class="label">Date &amp; time</div><div class="value">${e.date} · ${e.time}</div></div>
    </div>

    <div class="section">
      <h3>Description</h3>
      <p>${e.desc}</p>
    </div>

    <div class="section">
      <h3>Overview</h3>
      <div class="stat-row">
        <div class="stat-card"><div class="num">${e.attendees}</div><div class="lbl">Attendees</div></div>
        <div class="stat-card"><div class="num">${e.budget}</div><div class="lbl">Budget allocated</div></div>
      </div>
    </div>

    <div class="actions">
      <button class="btn primary">✎ Edit event</button>
      <button class="btn">View attendance</button>
      <button class="btn danger">Archive</button>
    </div>
  `;
}

function selectEvent(id){
  selectedId = id;
  renderList();
  renderDetail();
}

renderList();
renderDetail();
</script>
</body>
</html>
